# Builds Windows, macOS and Linux packages after the tests pass, and keeps them as workflow artifacts.
# Manual only (Actions > release > Run workflow). Releases are published by hand after the packages are tested.
name: release
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win,   arch: x64 }
          - { os: macos-14,       platform: mac,   arch: arm64 }
          - { os: macos-13,       platform: mac,   arch: x64 }
          - { os: ubuntu-latest,  platform: linux, arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Package
        run: node scripts/package.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --keep
      - name: Smoke test (start the packaged app and read the hardware scan)
        shell: bash
        run: node scripts/smoke-package.mjs dist-release/InfluencerStudio-*-${{ matrix.platform }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: InfluencerStudio-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-release/*.zip
            dist-release/*.tar.gz
            dist-release/*.sha256
