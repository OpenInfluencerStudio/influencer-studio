# Builds Windows, macOS and Linux packages. Runs tests first. Creates a GitHub Release only for tags like v0.1.0.
# (Not run yet. Review before pushing.)
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win,   arch: x64 }
          - { os: macos-14,       platform: mac,   arch: arm64 }
          - { os: macos-13,       platform: mac,   arch: x64 }
          - { os: ubuntu-latest,  platform: linux, arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Package
        run: node scripts/package.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --keep
      - name: Smoke test (start the packaged app and read the hardware scan)
        shell: bash
        run: node scripts/smoke-package.mjs dist-release/InfluencerStudio-*-${{ matrix.platform }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: InfluencerStudio-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-release/*.zip
            dist-release/*.tar.gz
            dist-release/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Unsigned builds. Verify with the .sha256 files. See INSTALL.md inside each package."
